services:
  qqbot:
    build:
      context: .
      extra_hosts:
        - host.docker.internal:host-gateway
      secrets:
        - dotenv
    env_file:
      - .env
    environment:
      WORKSPACE_DIR: /workspace
      DATA_DIR: /data
      CODEX_HOME: /codex-home
      CODEX_SANDBOX_MODE: danger-full-access
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./workspace:/workspace
      - ./data:/data
      - ./codex-home:/codex-home
      - ./cron.d:/etc/cron.d
    restart: unless-stopped

secrets:
  dotenv:
    file: .env
